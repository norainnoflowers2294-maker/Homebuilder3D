<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>House Atelier 3D</title>
    <style>
        :root {
            --panel-bg: rgba(255, 255, 255, 0.9);
            --accent: #2c3e50;
            --highlight: #3498db;
        }
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { display: block; }

        /* UI Overlay */
        #ui-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .panel {
            pointer-events: auto;
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 0 0 15px 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        #toolbar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 30px;
            padding: 10px 20px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 20px;
            background: var(--accent);
            color: white;
            cursor: pointer;
            transition: 0.3s;
            font-weight: 600;
        }
        .btn:hover { background: var(--highlight); }
        .btn.active { background: #e67e22; }

        #status-bar {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 12px;
            color: #666;
            background: white;
            padding: 5px 10px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div id="ui-container">
    <div class="panel" style="width: fit-content; border-radius: 0 0 10px 10px;">
        <strong style="color: var(--accent)">House Atelier</strong>
        <button class="btn" onclick="exportProject()">Export JSON</button>
        <input type="file" id="importFile" style="display:none" onchange="importProject(this)">
        <button class="btn" onclick="document.getElementById('importFile').click()">Import</button>
    </div>

    <div id="status-bar">Mode: Navigation</div>

    <div class="panel" id="toolbar">
        <button class="btn active" onclick="setMode('nav', this)">Navigate</button>
        <button class="btn" onclick="setMode('wall', this)">Build Wall</button>
        <button class="btn" onclick="setMode('floor', this)">Lay Floor</button>
        <button class="btn" onclick="setMode('furniture', this)">Add Item</button>
        <button class="btn" onclick="clearAll()" style="background:#c0392b">Reset</button>
    </div>
</div>
