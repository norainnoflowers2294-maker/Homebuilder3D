            --accent: #4a90e2;
            --border: #444;
            --text: #ddd;
            --text-muted: #888;
        }

        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg-dark); 
            color: white; 
            touch-action: none; /* Prevents browser zoom/pan while in editor */
        }

        #ui-layer { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            pointer-events: none; 
            z-index: 10; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .panel { 
            pointer-events: auto; 
            background: var(--panel-bg); 
            backdrop-filter: blur(10px); 
            border: 1px solid var(--border); 
            color: var(--text); 
        }

        #toolbar {
